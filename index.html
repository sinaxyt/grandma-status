<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>وضعیت شهین مامان</title>
  <style>
    :root {
      --deep: #0f3d3e;
      --teal: #1f6f6b;
      --teal-soft: #e4f0ee;
      --gold: #c9a24b;
      --gold-soft: #f3e8c8;
      --cream: #f7f3ea;
      --paper: #fffdf8;
      --ink: #1d2b2b;
      --muted: #6b7a78;
      --line: #e3dccb;
      --green: #1f8a64;
      --red: #c0503f;
      --gray: #5d6b6a;
    }

    * { box-sizing: border-box; }

    body {
      font-family: Tahoma, Arial, sans-serif;
      color: var(--ink);
      margin: 0;
      padding: 20px;
      min-height: 100vh;
      background-color: var(--cream);
      background-image:
        repeating-linear-gradient(135deg, #0f3d3e0a 0 1px, transparent 1px 14px),
        linear-gradient(180deg, var(--deep) 0, var(--deep) 190px, var(--cream) 190px);
      background-attachment: fixed;
    }

    .card {
      max-width: 430px;
      margin: 20px auto;
      border-radius: 24px;
      background: var(--paper);
      border: 1px solid var(--line);
      box-shadow:
        0 0 0 6px #ffffff1a,
        0 18px 50px #0f3d3e33;
      overflow: hidden;
    }

    /* ---------- هدر ---------- */
    .head {
      position: relative;
      text-align: center;
      padding: 28px 20px 22px;
      color: #fff;
      background:
        repeating-linear-gradient(90deg, #ffffff0d 0 1px, transparent 1px 22px),
        linear-gradient(135deg, var(--deep), var(--teal));
      border-bottom: 3px solid var(--gold);
    }

    .head::after {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid #c9a24b66;
      border-radius: 16px;
      pointer-events: none;
    }

    .logo {
      width: 88px;
      height: 88px;
      margin: 0 auto 12px;
      border-radius: 50%;
      padding: 5px;
      background: linear-gradient(135deg, var(--gold), #f0d98c, var(--gold));
      box-shadow: 0 8px 20px #00000040;
    }

    .logo svg {
      display: block;
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    h1, h2 { text-align: center; margin: 0; }

    h1 {
      font-size: 23px;
      letter-spacing: .2px;
    }

    .sub {
      margin: 6px 0 0;
      font-size: 12px;
      color: #cfe3e0;
    }

    .body { padding: 22px 24px 26px; }

    /* ---------- عنوان بخش‌ها با خط ---------- */
    h2 {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 16px;
      color: var(--deep);
      margin-top: 28px;
    }

    h2::before, h2::after {
      content: "";
      flex: 1;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
    }

    #login h2 { margin-top: 6px; }

    /* ---------- فرم و دکمه ---------- */
    input, button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border-radius: 12px;
      font-size: 16px;
      font-family: inherit;
    }

    input {
      border: 1px solid var(--line);
      border-bottom: 2px solid #d7cdb4;
      background: #fff;
      color: var(--ink);
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }

    input:focus {
      border-color: var(--teal);
      box-shadow: 0 0 0 3px #1f6f6b22;
    }

    button {
      border: none;
      border-bottom: 3px solid #00000026;
      color: #fff;
      cursor: pointer;
      font-weight: bold;
      background: var(--teal);
      transition: transform .1s, filter .15s;
    }

    button:hover { filter: brightness(1.08); }
    button:active { transform: translateY(2px); border-bottom-width: 1px; }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    .green { background: var(--green); }
    .red { background: var(--red); }
    .gray { background: var(--gray); margin-top: 22px; }

    /* ---------- وضعیت ---------- */
    #status {
      position: relative;
      text-align: center;
      font-size: 21px;
      font-weight: bold;
      padding: 24px 14px;
      margin: 4px 0 14px;
      border-radius: 16px;
      color: var(--deep);
      background:
        repeating-linear-gradient(45deg, #1f6f6b0d 0 1px, transparent 1px 10px),
        var(--teal-soft);
      border: 1px solid #c4dcd8;
      border-right: 6px solid var(--gold);
    }

    #message {
      text-align: center;
      font-size: 14px;
      line-height: 1.8;
      overflow-wrap: anywhere;
      color: var(--muted);
      margin: 0 0 14px;
      padding-bottom: 14px;
      border-bottom: 1px dashed var(--line);
    }

    /* ---------- تاریخچه با خط زمانی ---------- */
    #history {
      margin-top: 14px;
      font-size: 15px;
      color: var(--ink);
    }

    #history .event {
      position: relative;
      padding: 12px 26px 12px 4px;
      border-bottom: 1px solid var(--line);
    }

    #history .event::before {
      content: "";
      position: absolute;
      right: 5px;
      top: 50%;
      width: 10px;
      height: 10px;
      margin-top: -5px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 0 3px var(--gold-soft);
      z-index: 1;
    }

    #history .event::after {
      content: "";
      position: absolute;
      right: 9px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--line);
    }

    #history .event:first-child::after { top: 50%; }
    #history .event:last-child::after { bottom: 50%; }
    #history .event:last-child { border-bottom: none; }

    .muted {
      color: var(--muted);
      font-size: 12.5px;
      text-align: center;
      margin: 16px 0 0;
      padding-top: 14px;
      border-top: 1px solid var(--line);
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <header class="head">
      <div class="logo">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <circle cx="50" cy="50" r="50" fill="#0f3d3e"/>
          <circle cx="50" cy="50" r="42" fill="none" stroke="#c9a24b" stroke-width="1" stroke-dasharray="2 3"/>
          <path d="M20 52 L50 25 L80 52" fill="none" stroke="#c9a24b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M28 49 V74 a4 4 0 0 0 4 4 H68 a4 4 0 0 0 4 -4 V49 L50 31 Z" fill="#f7f3ea"/>
          <path d="M50 66 c-9 -7 -12 -12 -12 -16 a6 6 0 0 1 12 -2 a6 6 0 0 1 12 2 c0 4 -3 9 -12 16z" fill="#c0503f"/>
        </svg>
      </div>
      <h1>وضعیت ورود/خروج</h1>
      <p class="sub">ورود/خروج به صورت آنلاین</p>
    </header>

    <div class="body">
      <p id="message" role="status">در حال اتصال...</p>

      <section id="login" hidden>
        <h2>ورود به حساب</h2>
        <form id="loginForm">
          <input id="email" type="email"
            placeholder="ایمیل" autocomplete="username" required>
          <input id="password" type="password"
            placeholder="رمز عبور" autocomplete="current-password" required>
          <button id="loginButton" type="submit">ورود</button>
        </form>
      </section>

      <section id="app" hidden>
        <div id="status">در حال دریافت وضعیت...</div>

        <button class="green" id="enterButton">ورود به خانه</button>
        <button class="red" id="exitButton">خروج از خانه</button>

        <h2>تاریخچه</h2>
        <div id="history"></div>

        <p class="muted">
         only date
        </p>

        <button class="gray" id="logoutButton">log out</button>
      </section>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

    import {
      getAuth,
      setPersistence,
      browserLocalPersistence,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

    import {
      getDatabase,
      ref,
      get,
      set,
      onValue,
      runTransaction
    } from
      "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

    // تنظیمات پروژه Firebase خودت
    const firebaseConfig = {
      apiKey: "AIzaSyDepkxpNulGnU79qKb5RvAZ4xQwduXP1oM",
      authDomain: "grandma-status.firebaseapp.com",
      databaseURL: "https://grandma-status-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "grandma-status",
      storageBucket: "grandma-status.firebasestorage.app",
      messagingSenderId: "993446216425",
      appId: "1:993446216425:web:8e1db40bd8870f8c426678"
    };

    // UID دو کاربر مجاز را از Firebase Authentication وارد کن.
    const ALLOWED_UIDS = [
      "jrgdDxvkPqfq84hjLBY64cWSfVy2",
      "rBDFl02X2mVnz1jE5wRSBbe4gFJ3"
    ];

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    const $ = id => document.getElementById(id);
    const loginSection = $("login");
    const appSection = $("app");
    const message = $("message");

    let stopStatusListener = null;
    let stopHistoryListener = null;
    let currentUser = null;
    let busy = false;

    function showMessage(text) {
      message.textContent = text;
    }

    function setBusy(value) {
      busy = value;
      ["enterButton", "exitButton", "loginButton"].forEach(id => {
        $(id).disabled = value;
      });
    }

    function formatTime(timestamp) {
      return new Intl.DateTimeFormat("fa-IR", {
        hour: "2-digit",
        minute: "2-digit",
        timeZone: "Asia/Tehran"
      }).format(new Date(timestamp));
    }

    function cleanupListeners() {
      if (stopStatusListener) stopStatusListener();
      if (stopHistoryListener) stopHistoryListener();
      stopStatusListener = null;
      stopHistoryListener = null;
    }

    function renderHistory(events) {
      const container = $("history");
      container.replaceChildren();

      const list = Object.values(events || {})
        .filter(event =>
          event &&
          Number.isFinite(event.timestamp) &&
          Date.now() - event.timestamp < 3 * 24 * 60 * 60 * 1000 &&
          event.timestamp <= Date.now() + 60_000 &&
          ["home", "out"].includes(event.status)
        )
        .sort((a, b) => b.timestamp - a.timestamp);

      if (!list.length) {
        container.textContent = "هنوز رویدادی وجود ندارد.";
        return;
      }

      list.forEach(event => {
        const row = document.createElement("div");
        row.className = "event";
        row.textContent =
          (event.status === "home" ? "ورود به خانه" : "خروج از خانه")
          + " — " + formatTime(event.timestamp);
        container.appendChild(row);
      });
    }

    async function recordStatus(status) {
      if (!currentUser || busy) return;

      setBusy(true);
      showMessage("در حال ذخیره اطلاعات...");

      try {
        const now = Date.now();
        const historyRef = ref(db, "events");
        const statusRef = ref(db, "currentStatus");

        // حذف تاریخچه قدیمی و افزودن رویداد جدید به صورت تراکنش.
        const result = await runTransaction(historyRef, old => {
          const events = old && typeof old === "object" ? old : {};

          for (const [key, event] of Object.entries(events)) {
            if (!event || !Number.isFinite(event.timestamp) ||
                now - event.timestamp >= 3 * 24 * 60 * 60 * 1000) {
              delete events[key];
            }
          }

          events[String(now) + "_" + currentUser.uid] = {
            status,
            timestamp: now
          };

          return events;
        });

        if (!result.committed) {
          throw new Error("ذخیره تاریخچه انجام نشد.");
        }

        await set(statusRef, {
          status,
          timestamp: now
        });

        showMessage("وضعیت با موفقیت به‌روز شد.");
      } catch (error) {
        console.error(error);
        showMessage("سیکتیررررر");
      } finally {
        setBusy(false);
      }
    }

    $("loginForm").addEventListener("submit", async event => {
      event.preventDefault();
      setBusy(true);
      showMessage("در حال ورود...");

      try {
        await setPersistence(auth, browserLocalPersistence);
        await signInWithEmailAndPassword(
          auth,
          $("email").value.trim(),
          $("password").value
        );
        $("password").value = "";
      } catch (error) {
        console.error(error);
        showMessage("siktirrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrrr");
      } finally {
        setBusy(false);
      }
    });

    $("enterButton").addEventListener("click", () => recordStatus("home"));
    $("exitButton").addEventListener("click", () => recordStatus("out"));

    $("logoutButton").addEventListener("click", async () => {
      cleanupListeners();
      await signOut(auth);
    });

    onAuthStateChanged(auth, async user => {
      cleanupListeners();
      currentUser = null;
      appSection.hidden = true;
      loginSection.hidden = true;

      if (!user) {
        loginSection.hidden = false;
        showMessage("برای ادامه وارد حساب شو.");
        return;
      }

      if (!ALLOWED_UIDS.includes(user.uid)) {
        await signOut(auth);
        loginSection.hidden = false;
        showMessage("این حساب اجازه استفاده از سایت را ندارد.");
        return;
      }

      currentUser = user;
      appSection.hidden = false;
      showMessage("متصل شدی؛ در حال دریافت وضعیت...");

      stopStatusListener = onValue(ref(db, "currentStatus"), snapshot => {
        const data = snapshot.val();

        if (!data || !["home", "out"].includes(data.status)) {
          $("status").textContent = "وضعیت هنوز مشخص نشده";
          return;
        }

        $("status").textContent =
          data.status === "home"
            ? "🟢 شهین مامان در خانه است"
            : "🔴 شهین مامان بیرون است";
      }, error => {
        console.error(error);
        showMessage("دریافت وضعیت ناموفق بود؛ اتصال یا دسترسی را بررسی کن.");
      });

      stopHistoryListener = onValue(ref(db, "events"), snapshot => {
        renderHistory(snapshot.val());
      }, error => {
        console.error(error);
        showMessage("دریافت تاریخچه ناموفق بود؛ قوانین دیتابیس را بررسی کن.");
      });
    });
  </script>
</body>
</html>
<footer style="text-align: center; padding: 15px; font-size: 13px; color: #888;">
